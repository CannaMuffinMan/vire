name: native-http
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  VIRE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  native-http-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: host http-prove and FAIL_BEFORE
        run: bash tools/native-http-ubuntu.sh
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~ListenSecurityTests|FullyQualifiedName~ListenTests.ListenerRejectsThroughHttpWire|FullyQualifiedName~FuzzTests.ListenRequestParseSeededFuzzNeverCrashes"
  native-http-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/native-selfhost-handoff.ps1
      - run: pwsh -File tools/native-http-windows.ps1
