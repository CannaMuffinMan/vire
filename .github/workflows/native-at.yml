name: native-at
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  at-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: bash tools/at-map-check.sh
  at-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/at-map-windows.ps1
      - name: native selfhost hashes if present
        shell: pwsh
        run: |
          $self = Get-Content tools/native-selfhost-handoff.ps1 -Raw
          if ($self -notmatch "gen1_sha256") { throw "missing gen1_sha256 in handoff" }
          Write-Output "compiler/runtime sources in this workflow; gen1=gen2 owned by check.yml native-selfhost-windows"
