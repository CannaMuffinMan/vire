name: perf-host
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/perf-host.yml"
      - "tools/perf-*"
      - "tests/Vire.Tests/PerfBreakMissCostTests.cs"
      - "COMPILE-PERF.md"
permissions:
  contents: read
jobs:
  windows-profile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/perf-profile-windows.ps1
      - run: python tools/perf-parse-heartbeats.py data/perf-hello.stamp.txt
      - run: python tools/perf-parse-heartbeats.py data/perf-gen1host.stamp.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: perf-host-windows
          path: |
            data/perf-hello.stamp.txt
            data/perf-hello.err.txt
            data/perf-gen1host.stamp.txt
            data/perf-gen1host.err.txt
            data/perf-break-miss.txt
