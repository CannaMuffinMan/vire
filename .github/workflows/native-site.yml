name: native-site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-site-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/native-selfhost-handoff.ps1
      - run: pwsh -File tools/native-site-windows.ps1
