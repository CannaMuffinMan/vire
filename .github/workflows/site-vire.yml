name: site-vire
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: interpret homepage samples
        run: bash site/vire/ci/check-host.sh
      - name: host-emit PE hex for homepage samples
        run: bash site/vire/ci/check-emit.sh
      - name: internal site links
        run: python3 site/vire/ci/check-links.py
  native-pe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: compile and run homepage samples as native PE
        run: pwsh -File site/vire/ci/check-native.ps1
