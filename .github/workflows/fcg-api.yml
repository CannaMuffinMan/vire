name: fcg-api
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fcg-api-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fcgci
          POSTGRES_USER: postgres
          POSTGRES_DB: fcgci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcgci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: dotnet build vire.csproj -c Release
      - name: prove host FCG API
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: fcgci
          PGDATABASE: fcgci
          REDIS_PORT: "6379"
        run: bash tools/fcg-api-prove.sh
  fcg-api-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/fcg-api-prove-windows.ps1
