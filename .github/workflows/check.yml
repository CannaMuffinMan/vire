name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
  test-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~F2_LinuxOrdinaryFileLinkCountIsOne|FullyQualifiedName~HardLinkCannotRewriteDepsLock" --logger "console;verbosity=detailed"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: host C and Java toolchains
        run: sudo apt-get update && sudo apt-get install -y gcc clang mingw-w64 default-jdk-headless
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo --no-build --filter "FullyQualifiedName~HostCheckThenOpenToctouFailBeforePassAfter|FullyQualifiedName~LinuxWritableZoneCompareIsCaseSensitive|FullyQualifiedName~F13_ArenaCheckUsesOneMegHeaderReserves|FullyQualifiedName~F8_EmitU8WrapsToAnd255|FullyQualifiedName~HardLinkCannotRewriteDepsLock" --logger "console;verbosity=detailed"
  tracked-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - run: bash tools/check-tracked-binaries.sh
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - run: docker build -t vire .
      - run: docker run --rm vire tests.vire
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: bash tools/selfhost-check.sh
      - run: bash tools/native-arena-check.sh
      - run: bash tools/native-sec-emu-check.sh
      - run: bash tools/l1-residuals-check.sh
  selfhost-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/selfhost-check.ps1
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/native-hello-handoff.ps1
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~HostCheckThenOpenToctouFailBeforePassAfter" --logger "console;verbosity=detailed"
      - run: pwsh -File tools/native-sec-windows.ps1
      - run: pwsh -File tools/native-smoke.ps1
      - run: pwsh -File tools/native-oom.ps1
      - run: pwsh -File tools/native-gc-loop-proof.ps1
      - run: pwsh -File tools/schema-prove-windows.ps1
      - run: pwsh -File tools/native-tcp-windows.ps1
      - run: pwsh -File tools/native-list-cap-proof.ps1
  native-selfhost-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: bounded native selfhost
        run: pwsh -File tools/native-selfhost-handoff.ps1
  native-pg-windows:
    runs-on: windows-latest
    env:
      PGPORT: "55432"
      PGPASSWORD: ThrowawayVireCi1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: loopback PostgreSQL 16 host+PE prove
        run: pwsh -File tools/pg-prove-windows.ps1
      - name: pin 5b10ea5f reachable for FAIL_BEFORE worktree
        run: git merge-base --is-ancestor 5b10ea5fa5eea46859f17a52b36037d9d088c01d HEAD
  native-redis-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: FAIL_BEFORE silent skip exited 0; skip now fails closed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $base = "103f189e54630f11a127907a84b91faa1b59375c"
          $old = git show "${base}:tools/redis-prove-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "git show $base redis-prove-windows.ps1 failed" }
          if ($old -notmatch '(?s)if \(\$null -eq \$redis\) \{.*?exit 0') {
            throw "FAIL_BEFORE: $base redis-prove-windows.ps1 missing silent skip exit 0"
          }
          $oldSkip = @'
          $redis = $null
          if ($null -eq $redis) {
            Write-Output "REDIS_SERVER_UNAVAILABLE on this Windows runner (no redis-server.exe / Memurai). Decode and adversarial fake-server proofs still ran. Live SET/GET against a real Redis binary was not executed here."
            Write-Output "redis windows prove ok (decode+adv; live redis residual)"
            exit 0
          }
          '@
          & pwsh -NoProfile -Command $oldSkip
          if ($LASTEXITCODE -ne 0) { throw "FAIL_BEFORE expected old skip path exit 0, got $LASTEXITCODE" }
          Write-Output "FAIL_BEFORE skip path exit 0 at $base"
          & pwsh -File tools/redis-prove-windows.ps1 -SkipPathSelfTest
          if ($LASTEXITCODE -eq 0) { throw "new redis-prove-windows.ps1 must exit non-zero on skip path" }
          Write-Output "PASS_AFTER skip path exit $LASTEXITCODE (fail closed)"
      - run: pwsh -File tools/redis-prove-windows.ps1
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: single-file builds
        run: |
          dotnet publish vire.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/win-x64
          dotnet publish vire.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/linux-x64
          (cd dist && sha256sum win-x64/vire.exe linux-x64/vire > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vire-single-file
          path: |
            dist/win-x64/vire.exe
            dist/linux-x64/vire
            dist/SHA256SUMS
