name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - name: interpreter Hello World
        run: |
          set -euo pipefail
          VIRE=(dotnet exec bin/Release/net10.0/vire.dll)
          printf 'Hello, World!\n' > want.txt
          "${VIRE[@]}" examples/hello/hello.vire > got-interp.txt
          test "$?" -eq 0
          cmp -s got-interp.txt want.txt
      - name: compiled Hello World
        run: |
          set -euo pipefail
          VIRE=(dotnet exec bin/Release/net10.0/vire.dll)
          export VIRE_SEAL_KEY="$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
          export VIRE_BUDGET=5000000
          mkdir -p data
          cp examples/hello/hello.vire data/hello.vire
          "${VIRE[@]}" compiler.vire data/hello.vire data/hello.vc
          printf 'Hello, World!\n' > want.txt
          "${VIRE[@]}" run data/hello.vc > got-compiled.txt
          test "$?" -eq 0
          cmp -s got-compiled.txt want.txt
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Vire.Tests/Vire.Tests.csproj -c Release --nologo
  tracked-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - run: bash tools/check-tracked-binaries.sh
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - run: docker build -t vire .
      - run: docker run --rm vire tests.vire
      - name: docker Hello World
        run: |
          set -euo pipefail
          printf 'Hello, World!\n' > want.txt
          docker run --rm vire examples/hello/hello.vire > got-docker.txt
          cmp -s got-docker.txt want.txt
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: bash tools/selfhost-check.sh
  selfhost-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/selfhost-check.ps1
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet build vire.csproj -c Release
      - run: pwsh -File tools/native-smoke.ps1
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1 (tag v4)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: single-file builds
        run: |
          dotnet publish vire.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/win-x64
          dotnet publish vire.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/linux-x64
          (cd dist && sha256sum win-x64/vire.exe linux-x64/vire > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vire-single-file
          path: |
            dist/win-x64/vire.exe
            dist/linux-x64/vire
            dist/SHA256SUMS
